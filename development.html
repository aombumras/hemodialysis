<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เส้นทางแห่งนวัตกรรมและการพัฒนา</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<style>
:root{color-scheme:dark;
--bg:#06231b;--bg2:#0b3a2c;--ink:#e8efe6;--muted:#9fbaa9;--gold:#e6c15a;--gold2:#f7e2a0;--gold3:#b7862c;--green:#2f9d72;
--line:rgba(230,193,90,.22);
--f-body:"Noto Sans Thai","Sarabun",system-ui,sans-serif;--f-disp:"Prompt","Noto Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 500px at 15% -5%,rgba(47,157,114,.28),transparent 60%),radial-gradient(800px 500px at 100% 30%,rgba(230,193,90,.10),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 45%);background-attachment:fixed;
color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:32px 64px}
img{max-width:100%}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:150px minmax(0,720px) 150px;gap:24px;align-items:start;justify-content:center}
.center{min-width:0}
.rail{display:flex;flex-direction:column;gap:16px;padding-top:10px}
.ph{border-radius:13px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.04);box-shadow:0 14px 26px -14px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06)}
.ph img{display:block;width:100%;height:auto}

.hero{margin:0;padding:6px;border-radius:24px;background:linear-gradient(135deg,var(--gold2),var(--gold3) 45%,var(--gold) 70%,var(--gold3));box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08),0 0 60px -10px rgba(230,193,90,.35)}
.hero img{display:block;width:100%;height:auto;border-radius:18px;background:#fff}
.tl{position:relative;max-width:720px;margin:52px auto 0;display:grid;gap:26px}
.tl::before{content:"";position:absolute;left:26px;top:20px;bottom:20px;width:3px;margin-left:-1.5px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold3) 35%,var(--green) 70%,var(--gold));box-shadow:0 0 14px rgba(230,193,90,.45)}
.yr{position:relative;display:grid;grid-template-columns:52px 1fr;gap:0 22px;align-items:start}
.node{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#4a3608;
 background:radial-gradient(circle at 32% 28%,#fff3c2,var(--gold) 45%,var(--gold3));
 box-shadow:0 0 0 5px var(--bg),0 0 0 6px rgba(230,193,90,.5),0 10px 22px -4px rgba(0,0,0,.7),inset 0 -4px 8px rgba(120,80,10,.35),inset 0 2px 3px rgba(255,255,255,.7)}
.node svg{width:26px;height:26px}
.panel{border-radius:18px;padding:16px 20px 12px;border:1px solid var(--line);
 background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
 box-shadow:0 22px 40px -22px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.09)}
.phd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.phd h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:1.35rem;line-height:1.2;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.phd span{font-size:.8rem;color:var(--muted)}
ol{margin:0;padding:0;list-style:none}
li{display:grid;grid-template-columns:2rem 1fr;gap:0 6px;padding-block:8px;border-top:1px dashed rgba(230,193,90,.16);font-size:.875rem;line-height:1.6}
li:first-child{border-top:0}
.n{color:var(--gold);font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;padding-right:6px}
.ty,.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;line-height:1;padding:4px 8px;border-radius:999px;vertical-align:1px;margin-right:4px;white-space:nowrap}
.ty{color:var(--muted);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.ty svg,.pill svg{width:12px;height:12px;flex:none}
.pill{font-weight:600}
.p1{color:#3d2c04;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 2px 6px rgba(230,193,90,.35)}
.p2{color:var(--gold2);border:1px solid var(--gold3);background:rgba(230,193,90,.10)}
.p3{color:#a9e6c8;border:1px solid rgba(47,157,114,.7);background:rgba(47,157,114,.14)}
.p4{color:var(--muted);border:1px dashed rgba(159,186,169,.5)}
.tx{color:var(--muted)}
.tt{color:var(--ink);font-weight:500}
.sb{color:var(--muted)}

@media (max-width:900px){
 .stage{display:flex;flex-direction:column;max-width:640px;gap:0}
 .center{order:1}
 .rail-left{order:2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:22px}
 .rail-right{order:3;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
}
@media (max-width:420px){
 .tl::before{left:20px}
 .yr{grid-template-columns:40px 1fr;gap:0 14px}
 .node{width:40px;height:40px}.node svg{width:20px;height:20px}
 .panel{padding:14px 14px 10px}
 li{grid-template-columns:1.6rem 1fr}
 .rail-left,.rail-right{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
